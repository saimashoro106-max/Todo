{% extends "base.html" %}

{% block title %}Add Student - Student Management System{% endblock %}

{% block content %}
<h2>Add New Student</h2>

<form method="POST" action="/create">
    <div class="form-group">
        <label for="roll_number">Roll Number *</label>
        <input type="text" id="roll_number" name="roll_number" required placeholder="e.g., CS2024001">
    </div>

    <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required placeholder="e.g., John Doe">
    </div>

    <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required placeholder="e.g., john@example.com">
    </div>

    <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="text" id="phone" name="phone" required placeholder="e.g., +92-300-1234567">
    </div>

    <div class="form-group">
        <label for="department">Department *</label>
        <select id="department" name="department" required>
            <option value="">Select Department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Electrical Engineering">Electrical Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
            <option value="Business Administration">Business Administration</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
        </select>
    </div>

    <div class="form-group">
        <label for="year">Year *</label>
        <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cgpa">CGPA *</label>
        <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="4" required placeholder="e.g., 3.75">
    </div>

    <div style="display: flex; gap: 10px;">
        <button type="submit" class="btn btn-success">✓ Add Student</button>
        <a href="/" class="btn btn-danger">✗ Cancel</a>
    </div>
</form>
{% endblock %}
