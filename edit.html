{% extends "base.html" %}

{% block title %}Edit Student - Student Management System{% endblock %}

{% block content %}
<h2>Edit Student Information</h2>

<form method="POST" action="/edit/{{ student.id }}">
    <div class="form-group">
        <label for="roll_number">Roll Number *</label>
        <input type="text" id="roll_number" name="roll_number" value="{{ student.roll_number }}" required>
    </div>

    <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" value="{{ student.name }}" required>
    </div>

    <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" value="{{ student.email }}" required>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="text" id="phone" name="phone" value="{{ student.phone }}" required>
    </div>

    <div class="form-group">
        <label for="department">Department *</label>
        <select id="department" name="department" required>
            <option value="Computer Science" {% if student.department == "Computer Science" %}selected{% endif %}>Computer Science</option>
            <option value="Electrical Engineering" {% if student.department == "Electrical Engineering" %}selected{% endif %}>Electrical Engineering</option>
            <option value="Mechanical Engineering" {% if student.department == "Mechanical Engineering" %}selected{% endif %}>Mechanical Engineering</option>
            <option value="Civil Engineering" {% if student.department == "Civil Engineering" %}selected{% endif %}>Civil Engineering</option>
            <option value="Business Administration" {% if student.department == "Business Administration" %}selected{% endif %}>Business Administration</option>
            <option value="Mathematics" {% if student.department == "Mathematics" %}selected{% endif %}>Mathematics</option>
            <option value="Physics" {% if student.department == "Physics" %}selected{% endif %}>Physics</option>
            <option value="Chemistry" {% if student.department == "Chemistry" %}selected{% endif %}>Chemistry</option>
        </select>
    </div>

    <div class="form-group">
        <label for="year">Year *</label>
        <select id="year" name="year" required>
            <option value="1" {% if student.year == 1 %}selected{% endif %}>1st Year</option>
            <option value="2" {% if student.year == 2 %}selected{% endif %}>2nd Year</option>
            <option value="3" {% if student.year == 3 %}selected{% endif %}>3rd Year</option>
            <option value="4" {% if student.year == 4 %}selected{% endif %}>4th Year</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cgpa">CGPA *</label>
        <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="4" value="{{ student.cgpa }}" required>
    </div>

    <div style="display: flex; gap: 10px;">
        <button type="submit" class="btn btn-success">✓ Update Student</button>
        <a href="/" class="btn btn-danger">✗ Cancel</a>
    </div>
</form>
{% endblock %}
